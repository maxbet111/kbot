name: CI/CD Kbot

on: push

permissions:
  contents: write
  packages: write

jobs:
  ci:
    name: CI
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Run test
        run: make test
      - name: Docker hub login
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}  

      - name: Build and push Docker image
        env:
          APP: "kbot"
          # Якщо використовуєш Docker Hub, то REGISTRY — це твій username
          # Якщо GHCR — то ghcr.io/${{ github.repository_owner }}
          REGISTRY: ghcr.io/$(shell echo ${{ github.repository_owner }} | tr '[:upper:]' '[:lower:]')
        run: |
          # Можна викликати окремо або разом, якщо цілі прописані в Makefile
          make image
          make push
      
      - name: Login to GHCR
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}