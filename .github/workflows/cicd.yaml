name: CI/CD Pipeline

on:
  push:
    branches: [main]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    # Дозволи для роботи з GitHub Packages
    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          # Використовуємо short SHA коміту як тег для унікальності
          tags: ghcr.io/${{ github.repository }}:${{ github.sha }}

      - name: Update Image Tag in GitOps Repo
        run: |
          # 1. Налаштування Git
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          # 2. Клонуємо репозиторій конфігурації
          # ВАЖЛИВО: Тобі потрібен Secret під назвою GITOPS_CONFIG_TOKEN
          git clone https://x-access-token:${{ secrets.GITOPS_CONFIG_TOKEN }}@github.com/${{ github.repository_owner }}/gke-gitops-config.git
          cd gke-gitops-config

          # 3. Оновлюємо тег у файлі kbot-release.yaml
          # Ми шукаємо рядок 'tag:' і міняємо його на новий SHA
          sed -i "s/tag: .*/tag: ${{ github.sha }}/" kbot-release.yaml

          # 4. Комітимо та пушимо зміни
          git add kbot-release.yaml
          git commit -m "Update kbot image to ${{ github.sha }} [skip ci]"
          git push origin main
