# Default values for helm.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.
replicaCount: 1
image:
  registry: "ghcr.io"
  repository: "maxbet111/kbot" # Наприклад: maxbet111/mk-app
  tag: "v0.0.1" # Це буде змінюватися автоматично
  os: linux
  arch: amd64

# Не забудь про TELE_TOKEN, який ми обговорювали раніше
secrets:
  teleToken: ""
securityContext:
  privileged: true
